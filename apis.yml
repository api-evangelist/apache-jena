aid: apache-jena
name: Apache Jena
description: >-
  Apache Jena is a Java framework for building Semantic Web and Linked Data applications. It provides APIs for RDF, SPARQL, OWL, and a triplestore database (TDB) along with the Fuseki SPARQL server.
