    resources:
    - name: $-datasets
      path: /$/datasets
      operations:
      - name: listdatasets
        method: GET
        description: Apache jena Apache Jena Fuseki List Datasets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createdataset
        method: POST
        description: Apache jena Apache Jena Fuseki Create Dataset
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
