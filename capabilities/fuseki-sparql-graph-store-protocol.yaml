naftiko: 1.0.0-alpha2
info:
  label: Apache Jena Fuseki SPARQL API — Graph Store Protocol
  description: 'Apache Jena Fuseki SPARQL API — Graph Store Protocol. 4 operations. Lead operation: Apache jena Apache Jena
    Fuseki Get Graph. Self-contained Naftiko capability covering one Apache Jena business surface.'
  tags:
  - Apache Jena
  - Graph Store Protocol
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_JENA_API_KEY: APACHE_JENA_API_KEY
capability:
  consumes:
  - type: http
    namespace: fuseki-sparql-graph-store-protocol
    baseUri: http://localhost:3030
    description: Apache Jena Fuseki SPARQL API — Graph Store Protocol business capability. Self-contained, no shared references.
    resources:
    - name: dataset-data
      path: /{dataset}/data
      operations:
      - name: getgraph
        method: GET
        description: Apache jena Apache Jena Fuseki Get Graph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dataset
          in: path
          type: string
          required: true
        - name: graph
          in: query
          type: string
          description: Named graph URI (omit for default graph)
      - name: replacegraph
        method: PUT
        description: Apache jena Apache Jena Fuseki Replace Graph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dataset
          in: path
          type: string
          required: true
        - name: graph
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: addtograph
        method: POST
        description: Apache jena Apache Jena Fuseki Add to Graph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dataset
          in: path
          type: string
          required: true
        - name: graph
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletegraph
        method: DELETE
        description: Apache jena Apache Jena Fuseki Delete Graph
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dataset
          in: path
          type: string
          required: true
        - name: graph
          in: query
          type: string
  exposes:
  - type: rest
    namespace: fuseki-sparql-graph-store-protocol-rest
    port: 8080
    description: REST adapter for Apache Jena Fuseki SPARQL API — Graph Store Protocol. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/{dataset}/data
      name: dataset-data
      description: REST surface for dataset-data.
      operations:
      - method: GET
        name: getgraph
        description: Apache jena Apache Jena Fuseki Get Graph
        call: fuseki-sparql-graph-store-protocol.getgraph
        with:
          dataset: rest.dataset
          graph: rest.graph
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: replacegraph
        description: Apache jena Apache Jena Fuseki Replace Graph
        call: fuseki-sparql-graph-store-protocol.replacegraph
        with:
          dataset: rest.dataset
          graph: rest.graph
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addtograph
        description: Apache jena Apache Jena Fuseki Add to Graph
        call: fuseki-sparql-graph-store-protocol.addtograph
        with:
          dataset: rest.dataset
          graph: rest.graph
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletegraph
        description: Apache jena Apache Jena Fuseki Delete Graph
        call: fuseki-sparql-graph-store-protocol.deletegraph
        with:
          dataset: rest.dataset
          graph: rest.graph
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: fuseki-sparql-graph-store-protocol-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Jena Fuseki SPARQL API — Graph Store Protocol. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: apache-jena-apache-jena-fuseki
      description: Apache jena Apache Jena Fuseki Get Graph
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fuseki-sparql-graph-store-protocol.getgraph
      with:
        dataset: tools.dataset
        graph: tools.graph
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-jena-apache-jena-fuseki-2
      description: Apache jena Apache Jena Fuseki Replace Graph
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: fuseki-sparql-graph-store-protocol.replacegraph
      with:
        dataset: tools.dataset
        graph: tools.graph
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-jena-apache-jena-fuseki-3
      description: Apache jena Apache Jena Fuseki Add to Graph
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: fuseki-sparql-graph-store-protocol.addtograph
      with:
        dataset: tools.dataset
        graph: tools.graph
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: apache-jena-apache-jena-fuseki-4
      description: Apache jena Apache Jena Fuseki Delete Graph
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: fuseki-sparql-graph-store-protocol.deletegraph
      with:
        dataset: tools.dataset
        graph: tools.graph
      outputParameters:
      - type: object
        mapping: $.
